<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ഗൂഗിൾ സെർച്ചിൽ വരാനുള്ള വിവരങ്ങൾ -->
<title>Akam Boutique | Best Ladies & Kids Wear Kerala</title>
<meta name="description" content="Affordable sarees, kurtis, and designer wear for women. Order easily via WhatsApp from Akam Boutique.">
<meta name="keywords" content="boutique kerala, online saree shopping, kurtis kannur, akam boutique">
  <title>Boutique | Online Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --text-main: #2b2622;
      --text-muted: #736b63;
      --primary: #945749;
      --primary-hover: #7b4438;
      --accent: #d8c3b4;
      --border: #ece5dc;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 60px;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner {
      text-align: center;
      padding: 40px 20px 25px;
    }
    .banner h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 8px;
    }
    .banner p { color: var(--text-muted); font-size: 15px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .product-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: #f0f0f0;
    }
    .product-info { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .product-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .product-price { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .size-selector { display: flex; gap: 8px; margin-bottom: 14px; }
    .size-btn {
      border: 1px solid var(--border);
      background: transparent;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .size-btn.active {
      background: var(--text-main);
      color: white;
      border-color: var(--text-main);
    }
    .add-to-cart {
      margin-top: auto;
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-to-cart:hover { background: var(--primary); color: #fff; }

    /* Cart Sidebar */
    .cart-drawer {
      position: fixed;
      top: 0; right: -400px;
      width: 100%; max-width: 380px;
      height: 100%;
      background: white;
      box-shadow: -4px 0 25px rgba(0,0,0,0.15);
      z-index: 200;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    .cart-drawer.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; }
    .cart-items { flex-grow: 1; overflow-y: auto; margin: 15px 0; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
    .whatsapp-order-btn {
      background: #25D366;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <!-- ഇവിടെ നിങ്ങളുടെ ബോട്ടിക്കിന്റെ പേര് നൽകാം -->
      <a href="#" class="logo">AKAM BOUTIQUE</a>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 Bag (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <div class="banner">
    <h1>Exclusive Collection</h1>
    <p>Handpicked traditional & modern wear</p>
  </div>

  <main class="container">
    <div class="grid" id="product-grid"></div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Shopping Bag</h3>
      <button class="close-btn" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color:#777; margin-top:20px;">ബാഗ് ശൂന്യമാണ്!</p>
    </div>
    <div style="border-top: 1px solid var(--border); padding-top: 14px; margin-bottom: 12px;">
      <div style="display:flex; justify-content:space-between; font-weight:700; font-size:18px;">
        <span>Total:</span>
        <span id="cart-total">₹0</span>
      </div>
    </div>
    <button class="whatsapp-order-btn" onclick="sendWhatsAppOrder()">
      WhatsApp വഴി ഓർഡർ ചെയ്യുക
    </button>
  </div>

  <script>
    // ഇവിടെ നിങ്ങളുടെ 10 അക്ക WhatsApp നമ്പർ നൽകുക (91 ചേർത്ത്)
    const BOUTIQUE_PHONE = "919562264027"; 

    const products = [
      { id: 1, name: "Handloom Cotton Saree", price: 1850, img: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=600&auto=format&fit=crop" },
      { id: 2, name: "Georgette Floral Kurti", price: 1290, img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600&auto=format&fit=crop" },
      { id: 3, name: "Embroidered Party Gown", price: 3499, img: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600&auto=format&fit=crop" },
      { id: 3, name: "Embroidered Party Gown", price: 3499, img: "saree1.jpg.png" },
    ];

    let cart = [];
    const productGrid = document.getElementById("product-grid");

    function renderProducts() {
      productGrid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}">
          <div class="product-info">
            <h4 class="product-title">${p.name}</h4>
            <div class="product-price">₹${p.price}</div>
            <div class="size-selector" id="size-${p.id}">
              <button class="size-btn active" onclick="selectSize(${p.id}, 'M')">M</button>
              <button class="size-btn" onclick="selectSize(${p.id}, 'L')">L</button>
              <button class="size-btn" onclick="selectSize(${p.id}, 'XL')">XL</button>
            </div>
            <button class="add-to-cart" onclick="addToCart(${p.id})">Add to Bag</button>
          </div>
        </div>
      `).join('');
    }

    const selectedSizes = {};
    function selectSize(productId, size) {
      selectedSizes[productId] = size;
      const btns = document.querySelectorAll(`#size-${productId} .size-btn`);
      btns.forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function addToCart(productId) {
      const prod = products.find(p => p.id === productId);
      const size = selectedSizes[productId] || 'M';
      cart.push({ ...prod, selectedSize: size });
      updateCartUI();
      toggleCart(true);
    }

    function toggleCart(forceOpen = false) {
      const drawer = document.getElementById("cart-drawer");
      if (forceOpen) drawer.classList.add("open");
      else drawer.classList.toggle("open");
    }

    function updateCartUI() {
      document.getElementById("cart-count").innerText = cart.length;
      const list = document.getElementById("cart-items");
      if (cart.length === 0) {
        list.innerHTML = "<p style='color:#777; margin-top:20px;'>ബാഗ് ശൂന്യമാണ്!</p>";
        document.getElementById("cart-total").innerText = "₹0";
        return;
      }
      let total = 0;
      list.innerHTML = cart.map((item, idx) => {
        total += item.price;
        return `
          <div class="cart-item">
            <div>
              <div><strong>${item.name}</strong></div>
              <small style="color:#777;">Size: ${item.selectedSize} | ₹${item.price}</small>
            </div>
            <button style="border:none; background:none; color:red; cursor:pointer;" onclick="removeItem(${idx})">✕</button>
          </div>
        `;
      }).join('');
      document.getElementById("cart-total").innerText = "₹" + total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) {
        alert("ദയവായി സാധനങ്ങൾ ബാഗിൽ ചേർത്ത ശേഷം ഓർഡർ ചെയ്യുക.");
        return;
      }
      let text = "ഹലോ, എനിക്ക് ബോട്ടിക് വെബ്സൈറ്റിൽ നിന്നും ഇവ ഓർഡർ ചെയ്യണം:%0A%0A";
      let total = 0;
      cart.forEach((c, i) => {
        text += `${i+1}. *${c.name}* (Size: ${c.selectedSize}) - ₹${c.price}%0A`;
        total += c.price;
      });
      text += `%0A*ആകെ തുക: ₹${total}*`;
      
      const url = `https://wa.me/${BOUTIQUE_PHONE}?text=${text}`;
      window.open(url, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
